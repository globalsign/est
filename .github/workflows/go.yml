name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build-linux:

    strategy:
      matrix:
        go-version: [1.26.x,1.27.x]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Install SoftHSM
      run: sudo apt-get -y install softhsm2

    - name: Setup SoftHSM
      run: ./.github/scripts/setup-softhsm.sh
      shell: bash

    - name: Test
      run: go test -v ./...
      env:
        GLOBALSIGN_EST_SKIP: tpm

  build-macos:

    strategy:
      matrix:
        go-version: [1.24.x,1.25.x,1.26.x]

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
      env:
        GLOBALSIGN_EST_SKIP: hsm,tpm

  build-windows:

    strategy:
      matrix:
        go-version: [1.24.x,1.25.x,1.26.x]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...
